[pytest]
testpaths = tests

# auto mode: every async def test and fixture is treated as asyncio without
# needing a decorator on each one. The whole app is async, so opting in
# per-test would just be noise.
asyncio_mode = auto

# One event loop for the whole run. The session-scoped `app` fixture creates
# the SQLAlchemy engine and its connection pool on the loop that first
# touches it; a per-test loop would leave those bound to a closed one.
asyncio_default_fixture_loop_scope = session

addopts = -q --strict-markers
