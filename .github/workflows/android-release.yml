name: Android Release

# Triggered only by pushing a tag like "android-v0.2.0" - deliberately
# separate from the server's own release tags (e.g. v1.0.0, used by
# services/update_service.py for the server's self-update check) so the two
# don't collide in the same GitHub Releases list. The Android app's own
# UpdateChecker (network/GitHubApiService.kt) filters releases by this same
# "android-v" prefix and looks for an asset named exactly "wimmich-android.apk".
on:
  push:
    tags:
      - "android-v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # The keystore itself is never committed (repo is public - see
      # android/.gitignore) - it's decoded here from a repo secret so every
      # build (local + CI) shares the same signing identity, which Android
      # requires for one build to install as an "update" over another.
      # One-time setup: base64 the keystore and store it as a secret named
      # WIMMICH_DEBUG_KEYSTORE_BASE64 (see repo README/docs for the exact
      # command - never run that command through an AI assistant, since it
      # would transit the key material through the assistant).
      - name: Restore debug keystore from secret
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.WIMMICH_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/wimmich-debug.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Rename APK for the update-check asset name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk wimmich-android.apk

      - name: Create GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: wimmich-android.apk
          name: "Wimmich Android ${{ github.ref_name }}"
          body: "Automated build from tag ${{ github.ref_name }}. Sideload this APK, or let the app's own in-app update check pick it up."
